    {

      "mainEntity": [

          "@type": "Question",
          "name": "Comment fonctionne Versi Immobilier ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Versi Immobilier achète des biens en nom propre, les rénove, puis les revend. Pas d'intermédiaire, pas de mandat d'agence. Offre ferme sous 7 jours ou refus motivé par écrit."

          "@type": "Question",
          "name": "Versi Immobilier est-il un agent immobilier ?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "Quels types de biens Versi Immobilier achète-t-il ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Des actifs résidentiels et mixtes entre 250 000 € et 1 000 000 € en Hauts-de-France et Île-de-France. Immeubles de rapport, maisons divisibles, plateaux à transformer."
          }
        },
        {
          "@type": "Question",
          "name": "Comment est financé l'achat ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sur fonds propres. Pas de condition suspensive de financement. C'est ce qui permet l'offre ferme et le délai court."
          }
        },
        {
          "@type": "Question",
          "name": "Qui sont les fondateurs de Versi Immobilier ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Trois co-fondateurs : Maxime Lemoine (ex-Sony, 24 contrats locatifs), Thomas Issa (co-fondateur TEOS et Sarani, 13 actifs locatifs), Carl Standertskjold-Nordenstam (Head of Marketing Inbolt, co-fondateur Sarani). Versi Immobilier est une entité du Groupe Versi (versi.fr)."
