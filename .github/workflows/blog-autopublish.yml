name: Blog auto-publish

# Déclenche la génération + publication d'articles côté serveur Replit via un
# endpoint protégé par token (POST /api/cron/blog-generate). Le serveur a déjà
# DATABASE_URL + ANTHROPIC_API_KEY ; GitHub n'a donc besoin QUE du token partagé.
# La requête entrante réveille aussi le conteneur autoscale (qui dort sinon).
#
# IMPORTANT : les triggers `schedule` ne s'exécutent QUE depuis la branche par
# défaut du repo. Ce fichier doit y être mergé pour que les crons s'activent.
#
# Horaires en UTC. 07:00 UTC = 9h Paris (été) / 8h Paris (hiver).
#
# Secret requis : CRON_TRIGGER_TOKEN (même valeur dans les Secrets Replit des 2 sites).
# URLs surchargeables via repo variables INVEST_BASE_URL / IMMO_BASE_URL.

on:
  schedule:
    - cron: '0 7 * * 1'   # Lundi  — Versi Invest
    - cron: '0 7 * * 4'   # Jeudi  — Versi Immobilier
  workflow_dispatch:
    inputs:
      site:
        description: 'Site à publier (run manuel)'
        type: choice
        options:
          - both
          - invest
          - immobilier
        default: both

permissions:
  contents: read

concurrency:
  group: blog-autopublish
  cancel-in-progress: false

jobs:
  invest:
    name: Versi Invest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.site == 'invest' || github.event.inputs.site == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger generation
        env:
          TOKEN: ${{ secrets.CRON_TRIGGER_TOKEN }}
          BASE_URL: ${{ vars.INVEST_BASE_URL || 'https://versi-invest.fr' }}
        run: |
          set -euo pipefail
          echo "POST $BASE_URL/api/cron/blog-generate"
          out=$(curl -sS --max-time 600 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE_URL/api/cron/blog-generate")
          echo "--- réponse serveur ---"
          echo "$out"
          echo "$out" | grep -q "RESULT exit=0"

  immobilier:
    name: Versi Immobilier
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 4') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.site == 'immobilier' || github.event.inputs.site == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger generation
        env:
          TOKEN: ${{ secrets.CRON_TRIGGER_TOKEN }}
          BASE_URL: ${{ vars.IMMO_BASE_URL || 'https://versi-immobilier.fr' }}
        run: |
          set -euo pipefail
          echo "POST $BASE_URL/api/cron/blog-generate"
          out=$(curl -sS --max-time 600 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE_URL/api/cron/blog-generate")
          echo "--- réponse serveur ---"
          echo "$out"
          echo "$out" | grep -q "RESULT exit=0"
