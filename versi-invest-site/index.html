    <!-- Schema.org JSON-LD — FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Quel rendement attendre d'un investissement locatif en 2026 ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le rendement brut moyen d'un investissement locatif en France varie entre 3% et 10% selon la localisation et le type de bien. Versi Invest cible un rendement brut minimum de 8% sur les biens sourcés en Hauts-de-France et Île-de-France, avec une simulation financière détaillée incluant scénario nominal et scénario prudent."
          }
        },
        {
          "@type": "Question",
          "name": "Comment Versi Invest détecte-t-il des opportunités immobilières ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Versi Invest détecte des opportunités via son réseau terrain — alimenté par l'activité de marchand de biens de Versi Immobilier — et via une veille active sur le marché. Certains biens arrivent avant les portails publics, d'autres sont sourcés sur le marché. Le critère de sélection n'est pas le canal, c'est le rendement et le cashflow en scénario prudent."
          }
        },
        {
          "@type": "Question",
          "name": "Combien coûte Versi Invest ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Les honoraires Versi Invest sont de 5% du prix d'acquisition du bien, facturés uniquement à l'investisseur. Aucune rémunération côté vendeur. Ces honoraires couvrent l'intégralité du cycle : détection, visite, simulation financière, structuration, financement et acquisition."
          }
        },
        {
          "@type": "Question",
          "name": "Faut-il un apport pour investir dans l'immobilier locatif ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Un apport de 10% à 20% du prix du bien est généralement demandé par les banques pour un investissement locatif. Le montant exact dépend de votre profil emprunteur, de vos revenus et de votre endettement. Versi Invest réalise une simulation financière complète incluant le cashflow net selon différents niveaux d'apport, présentée lors de votre premier échange avec un fondateur."
          }
        },
        {
          "@type": "Question",
          "name": "Qu'est-ce que le cashflow positif en immobilier ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le cashflow positif signifie que les loyers perçus couvrent l'intégralité des charges (crédit, copropriété, taxe foncière, assurance, vacance locative) et dégagent un excédent mensuel. C'est l'objectif de chaque opération Versi Invest : un bien qui s'autofinance et génère un revenu net."
          }
        },
        {
          "@type": "Question",
          "name": "Quelle est la différence entre rendement brut et net ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le rendement brut = (loyers annuels / prix d'acquisition) × 100. Le rendement net déduit toutes les charges : taxe foncière, charges de copropriété, assurance PNO, vacance locative, gestion locative. Versi Invest calcule les deux dans chaque simulation, avec un scénario prudent à +15% de charges."
          }
        },
        {
          "@type": "Question",
          "name": "Qu'est-ce qu'un marchand de biens ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Un marchand de biens est un professionnel qui achète des biens immobiliers, les rénove et les revend. Versi Immobilier, l'entité sœur de Versi Invest au sein du Groupe Versi, opère comme marchand de biens — ce qui alimente le réseau terrain et le flux d'opportunités proposées aux investisseurs via Versi Invest."
          }
        }
      ]
    }
