    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Quel rendement attendre d'un investissement locatif en 2026 ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le rendement brut moyen d'un investissement locatif en France varie entre 3% et 10% selon la localisation et le type de bien. Versi Invest cible un rendement brut minimum de 8% sur les biens off-market sourcés en Hauts-de-France et Île-de-France, avec une simulation financière détaillée incluant scénario nominal et scénario prudent."
          }
        },
        {
          "@type": "Question",
          "name": "Qu'est-ce qu'un bien off-market en immobilier ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Un bien off-market est un bien immobilier proposé à la vente sans publication sur les portails publics (SeLoger, LeBonCoin). Ces biens sont accessibles via un réseau professionnel — chez Versi Invest, ils proviennent du flux d'opportunités détectées par l'activité de marchand de biens de Versi Immobilier."
          }
        },
        {
          "@type": "Question",
          "name": "Combien coûte un accompagnement à l'investissement locatif ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Les honoraires Versi Invest sont de 5% du prix d'acquisition du bien, facturés uniquement à l'investisseur. Aucune rémunération côté vendeur. Ces honoraires couvrent l'intégralité du cycle : sourcing, visite, simulation financière, financement, travaux et mise en location."
          }
        },
        {
          "@type": "Question",
          "name": "Faut-il un apport pour investir dans l'immobilier locatif ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Un apport de 10% à 20% du prix du bien est généralement demandé par les banques pour un investissement locatif. Le montant exact dépend de votre profil emprunteur, de vos revenus et de votre endettement. Le simulateur Versi Invest permet d'estimer le cashflow net en fonction de votre apport."
          }
        },
        {
          "@type": "Question",
          "name": "Qu'est-ce que le cashflow positif en immobilier ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le cashflow positif signifie que les loyers perçus couvrent l'intégralité des charges (crédit, copropriété, taxe foncière, assurance, vacance locative) et dégagent un excédent mensuel. C'est l'objectif de chaque opération Versi Invest : un bien qui s'autofinance et génère un revenu net."
          }
        },
        {
          "@type": "Question",
          "name": "Comment investir dans l'immobilier quand on n'a pas le temps ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Versi Invest prend en charge l'intégralité du cycle d'investissement : sourcing du bien, visites, simulation financière, accompagnement financement, pilotage travaux et mise en location. Un fondateur suit personnellement chaque opération de A à Z."
          }
        },
        {
          "@type": "Question",
          "name": "Quelle est la différence entre rendement brut et net ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le rendement brut = (loyers annuels / prix d'acquisition) × 100. Le rendement net déduit toutes les charges : taxe foncière, charges de copropriété, assurance PNO, vacance locative, gestion locative. Le simulateur Versi Invest calcule les deux, plus le cashflow net mensuel."
          }
        },
        {
          "@type": "Question",
          "name": "Qu'est-ce qu'un marchand de biens ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Un marchand de biens est un professionnel qui achète des biens immobiliers, les rénove et les revend. Versi Immobilier, l'entité sœur de Versi Invest au sein du Groupe Versi, opère comme marchand de biens — ce qui lui donne accès à un flux de biens off-market dont une partie est proposée aux investisseurs via Versi Invest."
          }
        }
      ]
