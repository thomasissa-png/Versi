            "@type": "Answer",
            "text": "Nos honoraires sont de 5% du prix d'acquisition, facturés uniquement à l'investisseur. Zéro rémunération côté vendeur — c'est inscrit dans le mandat. Ces 5% couvrent le cycle complet : détection, visite, simulation financière, structuration et acquisition."
          }
        },
        {
          "@type": "Question",
          "name": "Quel rendement attendre d'un investissement locatif avec Versi Invest ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "On cible un rendement brut minimum de 8% sur les biens sourcés en Hauts-de-France et Île-de-France. Chaque simulation inclut rendement brut, net et net-net, avec un scénario prudent à +15% de charges. On ne présente un bien que si les chiffres tiennent en scénario dégradé."
          }
        },
        {
          "@type": "Question",
          "name": "Quels sont les risques d'un investissement locatif ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vacance locative, travaux imprévus, baisse des loyers — les risques existent. C'est pour ça qu'on provisionne la vacance locative dans chaque simulation et qu'on calcule un scénario dégradé à +15% de charges. On ne présente que les dossiers qui restent rentables même dans le pire cas raisonnable."
          }
        },
        {
          "@type": "Question",
          "name": "Faut-il un apport minimum pour investir ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "En général, les banques demandent 10 à 20% du prix du bien. Le montant exact dépend de votre profil emprunteur. On réalise une simulation financière complète avec différents niveaux d'apport dès le premier échange — vous savez exactement où vous en êtes avant de vous engager."
          }
        },
        {
          "@type": "Question",
          "name": "Où sont situés les biens proposés par Versi Invest ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Principalement en Hauts-de-France — Lille, métropole lilloise, villes moyennes à fort rendement. Également en Île-de-France. Notre réseau terrain, alimenté par l'activité de marchand de biens de Versi Immobilier, nous donne accès à des biens avant ou en dehors des portails publics."
          }
        },
        {
          "@type": "Question",
          "name": "Comment ça se passe après l'inscription sur la liste d'attente ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Un fondateur vous recontacte sous 48h pour un premier échange. On parle de votre situation, vos objectifs, votre capacité d'investissement. Si un bien correspond à vos critères, on vous envoie le dossier complet avec simulation financière. Vous décidez — pas de pression, pas de relance."
          }
